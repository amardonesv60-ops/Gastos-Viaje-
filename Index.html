<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gastos de viaje</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin:0; padding:16px; background:#f4f1ea;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:#1c1c1a;
  }
  .wrap{max-width:460px;margin:0 auto;}
  .card{background:#fff;border-radius:14px;border:1px solid #e5e2d8;padding:16px}
  .input, .select{width:100%;box-sizing:border-box;height:44px;border-radius:8px;border:1px solid #d8d5c8;padding:0 10px;font-size:16px;background:#fdfcf9;color:#1c1c1a}
  .input:focus{outline:none;border-color:#8b7355;box-shadow:0 0 0 2px rgba(139,115,85,0.15)}
  .label{font-size:12px;color:#78766c;margin-bottom:4px;display:block;font-weight:600}
  .btn{width:100%;height:46px;border-radius:8px;border:none;background:#4a4438;color:#fdfcf9;font-size:16px;font-weight:600;cursor:pointer}
  .btn:active{transform:scale(0.98)}
  .btn-ghost{background:transparent;border:1px solid #d8d5c8;color:#78766c;height:36px;font-size:13px;border-radius:8px;cursor:pointer;padding:0 12px}
  .chip{padding:10px 4px;border-radius:8px;border:1px solid #d8d5c8;background:#fdfcf9;font-size:12px;text-align:center;cursor:pointer;color:#4a4438;font-weight:600;font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-appearance:none;appearance:none;}
  .chip.active{background:#4a4438;color:#fdfcf9;border-color:#4a4438}
  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #efece2}
  .row:last-child{border-bottom:none}
  .tag{font-size:11px;padding:2px 8px;border-radius:100px;font-weight:600}
  h1{font-size:18px;font-weight:600;margin:0 0 14px;color:#4a4438;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Gastos de viaje</h1>

  <div id="summary" style="margin-bottom:14px;"></div>

  <div class="card" style="margin-bottom:14px;">
    <label class="label">CATEGORÍA</label>
    <div id="cats" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px;"></div>

    <label class="label">MONTO</label>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <select class="select" id="moneda" style="width:90px;flex:none;">
        <option value="EUR">EUR</option>
        <option value="CLP">CLP</option>
        <option value="USD">USD</option>
      </select>
      <input type="number" inputmode="decimal" class="input" id="monto" placeholder="0">
    </div>

    <label class="label">DETALLE</label>
    <input type="text" class="input" id="detalle" placeholder="Ej: Almuerzo en Dubrovnik" style="margin-bottom:12px;">

    <label class="label">FECHA</label>
    <input type="date" class="input" id="fecha" style="margin-bottom:16px;">

    <button class="btn" id="add">Agregar gasto</button>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <span style="font-size:14px;font-weight:600;color:#4a4438;">Registro</span>
    <button class="btn-ghost" id="export">Exportar CSV</button>
  </div>

  <div id="list" class="card"></div>

  <p style="font-size:11px;color:#a8a598;text-align:center;margin-top:16px;">
    Los datos quedan guardados solo en este teléfono y navegador.
  </p>
</div>

<script>
(function(){
  const CATS = [
    {id:'entretencion', label:'Entretención', color:'#8b6cb0', bg:'#f1ebf7'},
    {id:'comida', label:'Comida', color:'#c17a3a', bg:'#f8ede0'},
    {id:'traslados', label:'Traslados', color:'#3a7ec1', bg:'#e5f0fa'},
    {id:'compras', label:'Compras', color:'#4a9a6a', bg:'#e6f3ea'},
    {id:'otros', label:'Otros', color:'#78766c', bg:'#efece2'}
  ];

  let selectedCat = 'comida';
  let expenses = [];
  const KEY = 'gastos_viaje_v1';

  function catInfo(id){ return CATS.find(c=>c.id===id) || CATS[CATS.length-1]; }

  function fmt(n, moneda){
    const symbols = {EUR:'€', CLP:'$', USD:'US$'};
    return (symbols[moneda]||'') + Math.round(n).toLocaleString('es-CL');
  }

  function todayISO(){ return new Date().toISOString().slice(0,10); }

  function renderCats(){
    const el = document.getElementById('cats');
    el.innerHTML = '';
    CATS.forEach(c=>{
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip' + (c.id===selectedCat ? ' active':'');
      btn.textContent = c.label;
      btn.addEventListener('click', function(){ selectedCat = c.id; renderCats(); });
      el.appendChild(btn);
    });
  }

  function renderSummary(){
    const totals = {};
    expenses.forEach(e=> totals[e.moneda] = (totals[e.moneda]||0) + e.monto);

    const byCat = {};
    CATS.forEach(c=>byCat[c.id]=0);
    expenses.forEach(e=> byCat[e.categoria] = (byCat[e.categoria]||0) + e.monto);

    const el = document.getElementById('summary');
    const totalLine = Object.keys(totals).length
      ? Object.entries(totals).map(([m,v])=>fmt(v,m)).join(' · ')
      : fmt(0,'EUR');

    let chips = CATS.filter(c=>byCat[c.id]>0).map(c=>
      `<div style="background:${c.bg};color:${c.color};border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;white-space:nowrap;">${c.label}</div>`
    ).join('');

    el.innerHTML = `
      <div style="background:#4a4438;border-radius:14px;padding:16px;color:#fdfcf9;margin-bottom:10px;">
        <div style="font-size:12px;opacity:0.75;margin-bottom:2px;">Total registrado</div>
        <div style="font-size:24px;font-weight:600;">${totalLine}</div>
      </div>
      <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;">${chips}</div>
    `;
  }

  function renderList(){
    const el = document.getElementById('list');
    if(expenses.length===0){
      el.innerHTML = '<div style="text-align:center;color:#a8a598;padding:20px 0;font-size:14px;">Aún no hay gastos registrados.</div>';
      return;
    }
    const sorted = [...expenses].sort((a,b)=> b.fecha.localeCompare(a.fecha) || b.id - a.id);
    el.innerHTML = sorted.map(e=>{
      const c = catInfo(e.categoria);
      const fecha = new Date(e.fecha+'T00:00:00').toLocaleDateString('es-CL',{day:'2-digit',month:'short'});
      return `<div class="row">
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;">
            <span class="tag" style="background:${c.bg};color:${c.color}">${c.label}</span>
            <span style="font-size:11px;color:#a8a598;">${fecha}</span>
          </div>
          <div style="font-size:13px;color:#4a4438;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${e.detalle || '—'}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="font-weight:600;font-size:14px;white-space:nowrap;">${fmt(e.monto,e.moneda)}</div>
          <button onclick="window.__del(${e.id})" style="border:none;background:none;color:#c17a3a;font-size:12px;cursor:pointer;">Borrar</button>
        </div>
      </div>`;
    }).join('');
  }

  function renderAll(){ renderSummary(); renderList(); }

  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      expenses = raw ? JSON.parse(raw) : [];
    }catch(e){ expenses = []; }
    renderAll();
  }

  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(expenses)); }
    catch(e){ alert('No se pudo guardar en este navegador.'); }
  }

  window.__del = function(id){
    expenses = expenses.filter(e=>e.id!==id);
    save(); renderAll();
  };

  document.getElementById('fecha').value = todayISO();

  document.getElementById('add').onclick = function(){
    const montoEl = document.getElementById('monto');
    const detalleEl = document.getElementById('detalle');
    const fechaEl = document.getElementById('fecha');
    const monedaEl = document.getElementById('moneda');

    const monto = parseFloat(montoEl.value);
    if(!monto || monto<=0){ montoEl.focus(); return; }

    expenses.push({
      id: Date.now(),
      categoria: selectedCat,
      monto: monto,
      moneda: monedaEl.value,
      detalle: detalleEl.value.trim(),
      fecha: fechaEl.value || todayISO()
    });

    save(); renderAll();
    montoEl.value = '';
    detalleEl.value = '';
    montoEl.focus();
  };

  document.getElementById('export').onclick = function(){
    let csv = 'Fecha,Categoria,Detalle,Monto,Moneda\n';
    [...expenses].sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(e=>{
      const detalle = (e.detalle||'').replace(/"/g,'""');
      csv += `${e.fecha},${catInfo(e.categoria).label},"${detalle}",${e.monto},${e.moneda}\n`;
    });
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'gastos_viaje.csv';
    a.click();
  };

  renderCats();
  load();
})();
</script>
</body>
</html>
